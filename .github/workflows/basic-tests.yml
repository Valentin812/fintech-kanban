name: Basic static app tests

on:
  push:
    branches:
      - main
      - "chore/**"
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: basic-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript syntax
        run: node scripts/check-inline-scripts.mjs
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.64.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: node tests/smoke.mjs
      - name: Run owner autocomplete browser test
        run: node tests/owner-autocomplete.mjs
      - name: Run admin users browser test
        run: node tests/admin-users.mjs
      - name: Run participants merge browser test
        run: node tests/participants-merge.mjs
      - name: Run board extras browser test
        run: node tests/board-extras.mjs
      - name: Run usability browser test
        run: node tests/usability.mjs
      - name: Run shared projects browser test
        run: node tests/shared-projects.mjs
      - name: Run Telegram inbox browser test
        run: node tests/telegram-inbox.mjs
      - name: Run UX pack browser test
        run: node tests/ux-oct23.mjs
      - name: Run mobile and themes browser test
        run: node tests/mobile-themes.mjs

      - name: Run mobile comfort browser test
        run: node tests/mobile-comfort.mjs

      - name: Run meeting AI browser test
        run: node tests/meeting-ai.mjs

      - name: Run meetings browser test
        run: node tests/meetings.mjs

      - name: Run Meeting Hub browser test
        run: node tests/meetings-hub.mjs

      - name: Run key notes browser test
        run: node tests/key-notes.mjs

      - name: Run assistant logic test
        run: node --experimental-strip-types tests/assistant-logic.mjs

      - name: Run assistant UI test
        run: node tests/assistant-ui.mjs

      - name: Run comments browser test
        run: node tests/comment-add.mjs

      - name: Run My tasks focus browser test
        run: node tests/my-tasks-focus.mjs

      - name: Run Releases tab browser test
        run: node tests/releases-tab.mjs

      - name: Run drawer fixes browser test
        run: node tests/drawer-fixes.mjs

      - name: Run quick notes browser test
        run: node tests/quick-notes.mjs
      - name: Run hover card and save/cancel browser test
        run: node tests/hover-save.mjs

      - name: Run complete button browser test
        run: node tests/complete-button.mjs

      - name: Run compact cards browser test
        run: node tests/compact-cards.mjs

      - name: Run board layout browser test
        run: node tests/board-layout.mjs

      - name: Run releases multi-project browser test
        run: node tests/releases-multi.mjs
      - name: Run project order browser test
        run: node tests/project-order.mjs
      - name: Quick task and note-to-project tests
        run: node tests/quick-task.mjs
      - name: Undo stack tests
        run: node tests/undo-stack.mjs
      - name: UI polish tests
        run: node tests/ui-polish.mjs
      - name: Cloud pull tests
        run: node tests/cloud-pull.mjs
      - name: Resources edit tests
        run: node tests/resources-edit.mjs

      - name: Run Telegram message parser test
        run: node --experimental-strip-types tests/telegram-parse.mjs
